<rect x="30" y="1470" width="1840" height="260" rx="8" fill="#fff" stroke="#cbd5e1"/><text class="noteHead" x="50" y="1498">Core relationships</text>
<text class="note" x="50" y="1526">students.id -&gt; reports.submitted_id; admins.id -&gt; reports.conference_findings_updated_by</text>
<text class="note" x="50" y="1550">reports.id / students.id / admins.id -&gt; report_student_links and student_offense_decisions</text>
<text class="note" x="50" y="1574">students.id / reports.id / admins.id -&gt; student_offense_records</text>
<text class="note" x="50" y="1598">Composite FK: student_offense_decisions(id, report_id, person_key) -&gt; student_offense_records(decision_id, incident_report_id, person_key)</text>
<text class="note" x="50" y="1622">student_offense_records.id / reports.id -&gt; student_offense_record_reports</text>
<text class="noteHead" x="50" y="1660">Scope</text>
<text class="note" x="50" y="1684">Conference schedule and request metadata are in reports.scheduled_conference (JSONB); conference findings are stored on reports.</text>
<text class="note" x="50" y="1708">Authentication, notification, awareness, location, grade-section, and audit-support tables are excluded.</text></svg>